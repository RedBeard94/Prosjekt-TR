<h1>Diabetes <em>enkel versjon.</em></h1>
<p class="lead">Det viktigste på ett sted.</p>
<div class="folder">

<a class="app" href="innstillinger/index.html"><span class="icon" style="background:linear-gradient(160deg,#818cf8,#4f46e5)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6"/></svg></span><span class="lb">Mine tall</span></a>
<a class="app" href="trendpiler/index.html"><span class="icon" style="background:linear-gradient(160deg,#f472b6,#be185d)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16l5-5 4 3 7-8M15 6h5v5"/></svg></span><span class="lb">Pilene</span></a>
<a class="app" href="tallene/index.html"><span class="icon" style="background:linear-gradient(160deg,#34d399,#059669)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14M9 4v16"/></svg></span><span class="lb">Tallene</span></a>
<a class="app" href="mat-og-blodsukker/index.html"><span class="icon" style="background:linear-gradient(160deg,#fb923c,#c2410c)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18M4 16c3 0 3-9 6-9s2 9 5 9 3-6 5-6"/></svg></span><span class="lb">Mat</span></a>
<button class="app hold" type="button" data-hold="5000" data-href="../diabetes/index.html" aria-label="Vanlig versjon. Hold inne i 5 sekunder."><span class="icon" style="background:linear-gradient(160deg,#94a3b8,#475569)"><i class="fill"></i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span><span class="lb">Vanlig</span><span class="hint">Hold inne 5 sek</span></button>
<button class="app hold" type="button" data-hold="2000" data-sos="1" aria-label="Akutt 113. Hold inne i 2 sekunder."><span class="icon" style="background:linear-gradient(160deg,#ef4444,#b91c1c)"><i class="fill"></i><svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11 11 0 0 0 3.6.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.6 3.6a1 1 0 0 1-.25 1z"/></svg></span><span class="lb">Akutt 113</span><span class="hint">Hold inne 2 sek</span></button>
<span id="vips" style="display:contents"></span>
</div>
<p class="small">Navn og nummer legges inn i vanlig versjon (hold inne «Vanlig»).</p>
</main>
<div class="ov" id="ov" role="alertdialog" aria-modal="true" aria-labelledby="ovh" hidden><h2 id="ovh">Ringer 113 om</h2><div class="cnt" id="cnt" aria-live="polite">5</div><p><b>Er du eller noen andre i nød?</b><br>Da skal du ringe. 113 er ambulanse.</p><p class="sm">Trykket du ved et uhell? Trykk Avbryt.</p><button class="av" id="av" type="button">AVBRYT</button><button class="nu" id="nu" type="button">Ring nå</button></div>
<div class="toast" id="t" role="status"></div>
<script>(function(){
var t=document.getElementById('t'),tm;function toast(m){t.textContent=m;t.classList.add('on');clearTimeout(tm);tm=setTimeout(function(){t.classList.remove('on')},2800)}
var PH='<svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11 11 0 0 0 3.6.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.6 3.6a1 1 0 0 1-.25 1z"/></svg>';
/* Numre: de samme som i vanlig versjon (Nyttig informasjon > Viktige personer) */
try{
  var l=JSON.parse(localStorage.getItem('rg-vip-liste')||'null');
  if(!Array.isArray(l)){var o=JSON.parse(localStorage.getItem('rg-vip')||'null');l=[o&&o.t?o:null];}
  l=l.filter(function(v){return v&&v.t&&String(v.t).replace(/[^\d+]/g,'')}).slice(0,2);
  var box=document.getElementById('vips');
  for(var i=0;i<2;i++){
    var v=l[i],a;
    if(v){a=document.createElement('a');a.className='app';a.href='tel:'+String(v.t).replace(/[^\d+]/g,'');
      a.innerHTML='<span class="icon" style="background:linear-gradient(160deg,#3b82f6,#1d4ed8)">'+PH+'</span><span class="lb"></span>';
      a.querySelector('.lb').textContent=v.n||'Ring';a.setAttribute('aria-label','Ring '+(v.n||'')+' '+v.t);}
    else{a=document.createElement('button');a.type='button';a.className='app empty';
      a.innerHTML='<span class="icon">'+PH.replace('#fff','#64748b')+'</span><span class="lb">Ingen nummer</span>';
      a.addEventListener('click',function(){toast('Numre legges inn i vanlig versjon. Hold inne «Vanlig» i 5 sekunder.')});}
    box.appendChild(a);
  }
}catch(e){}
/* Hold inne */
var ov=document.getElementById('ov'),cnt=document.getElementById('cnt'),ci=0,left=0;
function endSos(call){clearInterval(ci);ov.hidden=true;if(call){location.href='tel:113'}else toast('Avbrutt. Ingen samtale startet.')}
function startSos(){left=5;cnt.textContent=left;ov.hidden=false;document.getElementById('av').focus();clearInterval(ci);ci=setInterval(function(){left--;if(left<=0)endSos(true);else cnt.textContent=left},1000)}
document.getElementById('av').addEventListener('click',function(){endSos(false)});
document.getElementById('nu').addEventListener('click',function(){endSos(true)});
document.addEventListener('visibilitychange',function(){if(document.hidden&&!ov.hidden){clearInterval(ci);ov.hidden=true}});
document.querySelectorAll('.hold').forEach(function(b){var f=b.querySelector('.fill'),d=+b.dataset.hold,st=0,raf=0,done=0;
function stop(){cancelAnimationFrame(raf);if(!done){f.style.transition='height .15s';f.style.height='0'}st=0}
function go(){done=1;if(b.dataset.sos)startSos();else if(b.dataset.href)location.href=b.dataset.href;setTimeout(function(){done=0;f.style.height='0'},1200)}
function tick(){var p=Math.min(1,(performance.now()-st)/d);f.style.transition='none';f.style.height=p*100+'%';if(p>=1)go();else raf=requestAnimationFrame(tick)}
function begin(){if(done||st)return;st=performance.now();raf=requestAnimationFrame(tick)}
function end(){if(st&&!done){if(performance.now()-st<d)toast('Hold litt lenger inne');stop()}}
b.addEventListener('pointerdown',begin);b.addEventListener('pointerup',end);
['pointerleave','pointercancel'].forEach(function(ev){b.addEventListener(ev,function(){if(st&&!done)stop()})});
b.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!e.repeat){e.preventDefault();begin()}});
b.addEventListener('keyup',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();end()}});
b.addEventListener('blur',function(){if(st&&!done)stop()});
b.addEventListener('contextmenu',function(e){e.preventDefault()})});
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();</script>
