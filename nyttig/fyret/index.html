var $app = document.getElementById("app");
function esc(x){ return String(x).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function r1(x){ return (Math.round(x*10)/10).toString().replace(".",","); }
function r0(x){ return Math.round(x); }
function ok(v){ return typeof v==="number" && isFinite(v); }
function hhmm(d){ return d.toLocaleTimeString("nb-NO",{hour:"2-digit",minute:"2-digit"}); }
var DIRS=["N","NØ","Ø","SØ","S","SV","V","NV"];
function dirTxt(deg){ return DIRS[Math.round(((deg%360)+360)%360/45)%8]; }
function cacheGet(k,ttl){ try{ var o=JSON.parse(localStorage.getItem(k)); if(o && Date.now()-o.t<ttl) return o.v; }catch(e){} return null; }
function cacheSet(k,v){ try{ localStorage.setItem(k,JSON.stringify({t:Date.now(),v:v})); }catch(e){} }
function demoMode(){ return /[?&]demo=1/.test(location.search+location.hash); }

/* ---------- datakilder ---------- */
function getJSON(url, key, ttl){
  var c = cacheGet(key,ttl); if(c) return Promise.resolve(c);
  return fetch(url,{headers:{"Accept":"application/json"}}).then(function(r){
    if(!r.ok){ var e=new Error("HTTP "+r.status); e.status=r.status; throw e; } return r.json();
  }).then(function(j){ cacheSet(key,j); return j; });
}
function loadWeather(L){
  var u="https://api.met.no/weatherapi/locationforecast/2.0/complete?lat="+L.lat.toFixed(4)+"&lon="+L.lon.toFixed(4);
  return getJSON(u,"fy-w-"+L.id,10*60*1000);
}
function loadOcean(L){
  var u="https://api.met.no/weatherapi/oceanforecast/2.0/complete?lat="+L.lat.toFixed(4)+"&lon="+L.lon.toFixed(4);
  return getJSON(u,"fy-o-"+L.id,15*60*1000).catch(function(e){
    if(e&&(e.status===400||e.status===404||e.status===422)) return {properties:{timeseries:[]}};   /* punktet er utenfor havmodellen */
    throw e;
  });
}
function parseTime(s){ /* Kartverket svarer f.eks. 2026-10-27T09:10:00+00 */
  return new Date(String(s).replace(/([+-]\d\d)$/,"$1:00")).getTime();
}
function loadTide(L){
  var key="fy-t-"+L.id, c=cacheGet(key,15*60*1000);
  if(c) return Promise.resolve(c);
  var from=new Date(Date.now()-3*3600e3), to=new Date(Date.now()+27*3600e3);
  function f(d){ return d.toISOString().slice(0,16); }
  var u="https://vannstand.kartverket.no/tideapi.php?tide_request=locationdata&lat="+L.lat.toFixed(4)+"&lon="+L.lon.toFixed(4)
   +"&fromtime="+f(from)+"&totime="+f(to)+"&datatype=PRE&refcode=CD&lang=nb&interval=10&dst=0&tzone=0";
  return fetch(u).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); }).then(function(x){
    var doc=new DOMParser().parseFromString(x,"text/xml"), out=[];
    var blocks=doc.getElementsByTagName("data");
    for(var b=0;b<blocks.length;b++){
      if(blocks[b].getAttribute("type")!=="prediction") continue;
      var els=blocks[b].getElementsByTagName("waterlevel");
      for(var i=0;i<els.length;i++){ var v=parseFloat(els[i].getAttribute("value")), t=parseTime(els[i].getAttribute("time"));
        if(!isNaN(v)&&!isNaN(t)) out.push({t:t, v:v}); }
    }
    if(out.length<6) throw new Error("Ingen tidevannsdata");
    cacheSet(key,out); return out;
  });
}

/* ---------- eksempeldata (bare med ?demo=1) ---------- */
function seed(L){ var n=0; for(var i=0;i<L.id.length;i++) n+=L.id.charCodeAt(i); return n; }
function demoWeather(L){
  var s=seed(L)%7, ts=[], now=new Date(); now.setMinutes(0,0,0);
  for(var i=0;i<30;i++){ var t=new Date(now.getTime()+i*3600e3);
    ts.push({time:t.toISOString(),data:{instant:{details:{air_temperature:9+s*0.3+Math.sin(i/5),wind_speed:5+s*0.5+Math.sin(i/3)*2,wind_speed_of_gust:8+s*0.6+Math.sin(i/3)*3,wind_from_direction:(200+s*15+i*3)%360,relative_humidity:78,air_pressure_at_sea_level:1011+s,cloud_area_fraction:55}},next_1_hours:{summary:{symbol_code:"partlycloudy_day"},details:{precipitation_amount:i%7===3?0.4:0}}}});
  }
  return {properties:{timeseries:ts}};
}
function demoOcean(L){
  if(L.sheltered) return {properties:{timeseries:[]}};
  var s=seed(L)%7, ts=[], now=new Date(); now.setMinutes(0,0,0);
  for(var i=0;i<30;i++){ var t=new Date(now.getTime()+i*3600e3);
    ts.push({time:t.toISOString(),data:{instant:{details:{sea_surface_wave_height:0.6+s*0.12+Math.sin(i/4)*0.2,sea_surface_wave_from_direction:(230+s*10)%360,sea_water_temperature:11.2,sea_water_speed:0.15,sea_water_to_direction:(80+s*5)%360}}}});
  }
  return {properties:{timeseries:ts}};
}
function demoTide(){
  var out=[], now=Date.now();
  for(var i=-18;i<=162;i++){ var t=now+i*600e3; out.push({t:t, v:50+14*Math.sin((t/3600e3)*2*Math.PI/12.42)}); }
  return out;
}

/* ---------- uttrekk ---------- */
function nowIdx(ts){ var n=Date.now()-30*60e3; for(var i=0;i<ts.length;i++){ if(new Date(ts[i].time).getTime()>=n) return i; } return 0; }
function det(e){ return (e&&e.data&&e.data.instant&&e.data.instant.details)||{}; }
function verdict(w,o){
  var gust = ok(w.wind_speed_of_gust) ? w.wind_speed_of_gust : (w.wind_speed||0)*1.4;
  var hs = o && ok(o.sea_surface_wave_height) ? o.sea_surface_wave_height : null;
  if(gust>=17 || (hs!==null && hs>=2)) return {c:"bad",t:"Krevende forhold",x:"Kraftig vind i kast eller høy sjø. Småbåt bør vente."};
  if(gust>=10 || (hs!==null && hs>=1)) return {c:"mid",t:"Litt krevende",x:"Merkbar vind eller sjø. Vurder turen ekstra nøye."};
  return {c:"ok",t:"Rolig nå",x:"Svak vind og lav sjø akkurat nå."};
}

/* ---------- visninger ---------- */
function viewHub(){
  var h='<span class="tag"><span class="dot"></span> Ti fyr, fra Tvedestrand til Egersund</span>';
  h+='<h1>Fyret <em>langs Sørlandskysten.</em></h1>';
  h+='<p class="lead">Velg et fyr for å se været, sjøen og tidevannet der akkurat nå. Se også <a href="flekkeroya/index.html">Fyret på Flekkerøya</a>.</p>';
  h+='<div class="grid">';
  for(var i=0;i<LH.length;i++){ var L=LH[i];
    h+='<a class="card" href="#/'+L.id+'" aria-label="'+esc(L.name)+' fyr, '+esc(L.kommune)+'">'+tower(L.t)
      +'<p class="nm">'+esc(L.name)+'</p><p class="km">'+esc(L.kommune)+'</p><div class="mini" id="mini-'+L.id+'">'+(L.lat===null?'<span>Mangler koordinater</span>':'<span class="sk">00 °C 0 m/s</span>')+'</div></a>';
  }
  h+='</div>';
  h+=foot();
  $app.innerHTML=h;
  document.title="Fyret – Reinertsengruppen";
  LH.forEach(function(L,i){
    if(L.lat===null) return;
    setTimeout(function(){
      var el=document.getElementById("mini-"+L.id); if(!el) return;
      var p = demoMode()? Promise.resolve(demoWeather(L)) : loadWeather(L);
      p.then(function(j){
        var ts=j.properties.timeseries, d=det(ts[nowIdx(ts)]);
        if(!ok(d.air_temperature)||!ok(d.wind_speed)) throw new Error("tomt");
        el.innerHTML='<b>'+r0(d.air_temperature)+'°</b> <span>·</span> <b>'+r1(d.wind_speed)+' m/s</b>';
      }).catch(function(){ el.innerHTML='<span>Ikke tilgjengelig</span>'; });
    }, i*150);
  });
}
function m(l,v,s,e){ return '<div class="m"><div class="l">'+l+(e?'<span class="est">estimert</span>':'')+'</div><div class="v">'+v+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>'; }

function viewDetail(L){
  document.title=L.name+" fyr – Reinertsengruppen";
  var h='<a class="back" href="#/">← Alle fyr</a>';
  h+='<div class="head">'+tower(L.t)+'<div><span class="tag"><span class="dot" id="dot"></span> <span id="tagTxt">Henter forholdene …</span></span><h1>'+esc(L.name)+' <em>fyr.</em></h1><p class="lead" style="margin:0">'+esc(L.kommune)+' kommune. '+esc(L.fact)+'</p></div></div>';
  if(L.lat===null){
    h+='<div class="err">Koordinatene til dette fyret mangler, så vi kan ikke hente data ennå.</div>'+foot();
    $app.innerHTML=h; document.getElementById("tagTxt").textContent="Mangler koordinater"; return;
  }
  h+='<div id="demo"></div><div id="vd"></div><div id="sec"></div>';
  h+=foot();
  $app.innerHTML=h;

  var useDemo=demoMode(), failed={};
  function guard(p,fb,name){ return useDemo? Promise.resolve(fb()) : p.catch(function(){ failed[name]=1; return null; }); }
  Promise.all([
    guard(loadWeather(L),function(){return demoWeather(L);},"w"),
    guard(loadOcean(L),function(){return demoOcean(L);},"o"),
    guard(loadTide(L),demoTide,"t")
  ]).then(function(r){ render(L,r[0],r[1],r[2],useDemo,failed); });
}

function render(L,wj,oj,tide,isDemo,failed){
  var dot=document.getElementById("dot"), tag=document.getElementById("tagTxt"), host=document.getElementById("sec");
  if(!dot||!host) return;   /* brukeren har gått videre */
  if(!wj||!wj.properties||!wj.properties.timeseries||!wj.properties.timeseries.length){
    dot.className="dot demo"; tag.textContent="Ikke tilgjengelig";
    host.innerHTML='<div class="err">Vi kunne ikke hente været fra MET akkurat nå. Prøv igjen om litt.</div>'; return;
  }
  var wts=wj.properties.timeseries, wi=nowIdx(wts), w=det(wts[wi]);
  var n1=(wts[wi]&&wts[wi].data&&wts[wi].data.next_1_hours)||{};
  var ots=(oj&&oj.properties&&oj.properties.timeseries)||[], o=null;
  if(ots.length){ o=det(ots[nowIdx(ots)]); if(!ok(o.sea_surface_wave_height) && !ok(o.sea_water_temperature)) o=null; }
  var v=verdict(w,o);
  dot.className="dot"+(isDemo?" demo":"");
  tag.textContent=isDemo?"Eksempeldata":"Live fra MET og Kartverket";
  if(isDemo) document.getElementById("demo").innerHTML='<div class="demo-banner">Viser eksempeldata (?demo=1). Tallene er ikke live.</div>';
  document.getElementById("vd").innerHTML='<div class="verdict '+v.c+'" role="status"><h2>'+v.t+'</h2><p>'+v.x+'</p><p class="fine">En enkel pekepinn av tallene, ikke et sikkerhetsvarsel. Følg yr.no og Kystvakten for sikkerhet til sjøs.</p></div>';

  var h='', gust=w.wind_speed_of_gust;
  h+='<section class="sec"><h2>Været nå</h2><div class="mg">'
   +m("Temperatur",ok(w.air_temperature)?r0(w.air_temperature)+'<small> °C</small>':'–')
   +m("Vind",ok(w.wind_speed)?r1(w.wind_speed)+'<small> m/s</small>':'–',ok(w.wind_from_direction)?'fra '+dirTxt(w.wind_from_direction)+' <span class="arrow" style="transform:rotate('+(w.wind_from_direction+180)+'deg)">↑</span>':'')
   +m("Vindkast",ok(gust)?r1(gust)+'<small> m/s</small>':'–')
   +m("Nedbør neste time",(n1.details&&ok(n1.details.precipitation_amount)?r1(n1.details.precipitation_amount):'–')+'<small> mm</small>')
   +m("Lufttrykk",ok(w.air_pressure_at_sea_level)?r0(w.air_pressure_at_sea_level)+'<small> hPa</small>':'–')
   +m("Skydekke",ok(w.cloud_area_fraction)?r0(w.cloud_area_fraction)+'<small> %</small>':'–')
   +'</div></section>';
  h+='<section class="sec"><h2>Sjøen</h2>';
  if(o){
    var hs=o.sea_surface_wave_height, per=null;
    for(var k in o){ if(/period/.test(k) && ok(o[k])) { per=o[k]; break; } }
    h+='<div class="mg">'
     +(ok(hs)?m("Bølgehøyde (signifikant)",r1(hs)+'<small> m</small>','snittet av den høyeste tredjedelen'):'')
     +(ok(hs)?m("Største bølge",'ca. '+r1(hs*1.9)+'<small> m</small>','tommelfingerregel: 1,9 × signifikant',true):'')
     +(ok(o.sea_surface_wave_from_direction)?m("Bølger fra",dirTxt(o.sea_surface_wave_from_direction)+'<small> '+r0(o.sea_surface_wave_from_direction)+'°</small>'):'')
     +(per!==null?m("Bølgeperiode",r1(per)+'<small> s</small>','lang periode tyder på dønning'):'')
     +(ok(o.sea_water_temperature)?m("Sjøtemperatur",r1(o.sea_water_temperature)+'<small> °C</small>'):'')
     +(ok(o.sea_water_speed)?m("Strøm",r1(o.sea_water_speed)+'<small> m/s</small>',ok(o.sea_water_to_direction)?'mot '+dirTxt(o.sea_water_to_direction):''):'')
     +'</div><p class="note">MET gir total bølgehøyde, ikke dønning for seg. «Største bølge» er et estimat og ikke varslet av MET.</p>';
  } else if(failed.o){
    h+='<p class="note" style="margin:0">Vi kunne ikke hente havdata akkurat nå.</p>';
  } else {
    h+='<p class="note" style="margin:0">Ingen havdata for dette punktet. Fyret ligger trolig skjermet i skjærgården, utenfor MET sitt bølgerutenett.</p>';
  }
  h+='</section>';
  h+='<section class="sec"><h2>Tidevann</h2>'+(tide?tideHTML(tide):'<p class="note" style="margin:0">'+(failed.t?'Vi kunne ikke hente tidevann akkurat nå.':'Ingen tidevannsdata.')+'</p>')+'</section>';
  h+='<section class="sec"><h2>Neste 12 timer</h2><div class="hours">';
  var oby={}; ots.forEach(function(e){ oby[e.time]=det(e).sea_surface_wave_height; });
  for(var i=0;i<12;i++){ var e=wts[wi+i]; if(!e) break; var d=det(e), t=new Date(e.time);
    var ow=oby[e.time];
    var g=ok(d.wind_speed_of_gust)?d.wind_speed_of_gust:(d.wind_speed||0)*1.4;
    var lvl=g>=17?"var(--bad)":(g>=10?"var(--warn)":"var(--ok)");
    h+='<div class="hour">'+hhmm(t)+'<b>'+(ok(d.air_temperature)?r0(d.air_temperature)+'°':'–')+'</b>'+(ok(d.wind_speed)?r1(d.wind_speed)+' m/s':'–')+(ok(ow)?'<br>'+r1(ow)+' m':'')+'<div class="bar2" style="--lvl:'+lvl+'"></div></div>';
  }
  h+='</div><p class="note">Fargestreken viser vindkast: grønn under 10 m/s, gul 10 til 17, rød over 17. Tallet under er bølgehøyde der den finnes.</p></section>';
  host.innerHTML=h;
}

function tideHTML(tide){
  var now=Date.now(), pts=tide.filter(function(p){return p.t>=now-3*3600e3;}).sort(function(a,b){return a.t-b.t;});
  if(pts.length<6) return '<p class="note" style="margin:0">Ingen tidevannsdata.</p>';
  var cur=pts[0]; for(var i=0;i<pts.length;i++){ if(Math.abs(pts[i].t-now)<Math.abs(cur.t-now)) cur=pts[i]; }
  var prev=pts.filter(function(p){return p.t<=cur.t-30*60e3;}).pop();
  var dir=prev? (cur.v>prev.v?"stiger":(cur.v<prev.v?"faller":"")) : "";
  var ex=[], W=6;
  for(var j=W;j<pts.length-W;j++){ var win=pts.slice(j-W,j+W+1).map(function(p){return p.v;});
    var mx=Math.max.apply(null,win), mn=Math.min.apply(null,win);
    if(pts[j].v===mx && pts[j].v!==mn && pts[j].t>now) ex.push({k:"Høyvann",p:pts[j]}); else if(pts[j].v===mn && pts[j].v!==mx && pts[j].t>now) ex.push({k:"Lavvann",p:pts[j]}); }
  var seen={}, nx=[]; ex.forEach(function(e){ if(!seen[e.k] ){ seen[e.k]=1; nx.push(e); } });
  var h='<div class="mg">'+m("Vannstand nå",r0(cur.v)+'<small> cm</small>',dir);
  nx.forEach(function(e){ h+=m("Neste "+e.k.toLowerCase(),hhmm(new Date(e.p.t)),r0(e.p.v)+' cm'); });
  h+='</div>';
  var min=Math.min.apply(null,pts.map(function(p){return p.v;})), max=Math.max.apply(null,pts.map(function(p){return p.v;}));
  var t0=pts[0].t, t1=pts[pts.length-1].t, X=function(t){return 8+(t-t0)/(t1-t0)*304;}, Y=function(v){return 88-(v-min)/(max-min||1)*72;};
  var d=pts.map(function(p,i){return (i?"L":"M")+X(p.t).toFixed(1)+" "+Y(p.v).toFixed(1);}).join(" ");
  h+='<svg viewBox="0 0 320 104" width="100%" role="img" aria-label="Vannstand de neste timene" style="margin-top:12px;display:block;max-width:560px"><path d="'+d+' L312 96 L8 96Z" fill="#dbe8ff"/><path d="'+d+'" fill="none" stroke="#2563eb" stroke-width="2.2"/>'
   +'<line x1="'+X(now).toFixed(1)+'" x2="'+X(now).toFixed(1)+'" y1="8" y2="96" stroke="#d64545" stroke-width="1.4" stroke-dasharray="3 3"/><text x="'+(X(now)+4).toFixed(1)+'" y="16" font-size="10" fill="#d64545" font-weight="700">nå</text></svg>';
  h+='<p class="note">Beregnet vannstand, høyde over sjøkartnull. Kilde: Kartverket. Vær og vind kan gjøre at faktisk vannstand avviker.</p>';
  return h;
}

function foot(){
  return '<p class="foot">Værdata fra <a href="https://api.met.no" target="_blank" rel="noopener">Meteorologisk institutt (MET)</a>, lisens CC BY 4.0 / NLOD. Tidevann fra <a href="https://www.kartverket.no/til-sjos/se-havniva" target="_blank" rel="noopener">Kartverket</a>, lisens CC BY 4.0. '
   +'Fyret er ikke en varslingstjeneste. Vurderingen på siden er en enkel pekepinn og kan ta feil. Siden henter data direkte fra MET og Kartverket, som dermed får din IP-adresse, slik som ved alle andre nettsider. Siste svar lagres i nettleseren din i noen minutter. Det inneholder ingen personopplysninger. Utseendet på fyrtårnene er forenklede tegninger.</p>';
}

function route(){
  var id=(location.hash||"").replace(/^#\/?/,"").split("?")[0];
  var L=null; for(var i=0;i<LH.length;i++) if(LH[i].id===id) L=LH[i];
  if(L) viewDetail(L); else viewHub();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();

</script>

b.addEventListener('click',function(e){e.stopPropagation();set(m.hidden);});

})();
